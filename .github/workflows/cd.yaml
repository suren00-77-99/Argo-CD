name: CD - EKS Deployment

on:
  push:
    branches: [main]

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_GITHUB_CD_ROLE_ARN: ${{ vars.AWS_GITHUB_ROLE_ARN }}
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
  APP_NAMESPACE: ${{ vars.APP_NAMESPACE }}

  # Change these according to your project
  UI_RELEASE_NAME: ui
  UI_CHART_PATH: helm/ui

  # ECR image repository
  UI_IMAGE_REPOSITORY: ${{ vars.ECR_REGISTRY }}/ui

  # Image tag passed from CI
  IMAGE_TAG: latest

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: ap-south-1
      AWS_GITHUB_CD_ROLE_ARN: arn:aws:iam::322686612450:role/GitHubActions-CD-Role
      EKS_CLUSTER_NAME: suren-eks-cluster

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_GITHUB_CD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Install eksctl
        shell: bash
        run: |
          set -euo pipefail

          ARCH=$(uname -m)

          if [ "$ARCH" = "x86_64" ]; then
            ARCH="amd64"
          elif [ "$ARCH" = "aarch64" ]; then
            ARCH="arm64"
          else
            echo "Unsupported architecture: $ARCH"
            exit 1
          fi

          curl --fail --silent --show-error --location \
            "https://github.com/eksctl-io/eksctl/releases/latest/download/eksctl_Linux_${ARCH}.tar.gz" \
            | tar -xz -C /tmp

          sudo install -m 0755 /tmp/eksctl /usr/local/bin/eksctl

          eksctl version

      - name: Configure OIDC and EBS CSI Driver
        shell: bash
        run: |
          set -euo pipefail

          CLUSTER="${EKS_CLUSTER_NAME}"
          REGION="${AWS_REGION}"
          ACCOUNT_ID="322686612450"

          ROLE_NAME="${CLUSTER}-AmazonEKS_EBS_CSI_DriverRole"
          ROLE_ARN="arn:aws:iam::${ACCOUNT_ID}:role/${ROLE_NAME}"

          echo "Associating EKS OIDC provider..."

          eksctl utils associate-iam-oidc-provider \
            --cluster "$CLUSTER" \
            --region "$REGION" \
            --approve

          echo "Creating or updating EBS CSI IAM service account..."

          eksctl create iamserviceaccount \
            --cluster "$CLUSTER" \
            --region "$REGION" \
            --namespace kube-system \
            --name ebs-csi-controller-sa \
            --role-name "$ROLE_NAME" \
            --attach-policy-arn arn:aws:iam::aws:policy/service-role/AmazonEBSCSIDriverPolicy \
            --approve \
            --override-existing-serviceaccounts

          echo "Checking EBS CSI add-on..."

          STATUS=$(aws eks describe-addon \
            --cluster-name "$CLUSTER" \
            --addon-name aws-ebs-csi-driver \
            --region "$REGION" \
            --query 'addon.status' \
            --output text 2>/dev/null || echo "NOT_FOUND")

          echo "Current add-on status: $STATUS"

          if [ "$STATUS" = "NOT_FOUND" ]; then
            echo "Add-on not found. Creating..."

            aws eks create-addon \
              --cluster-name "$CLUSTER" \
              --addon-name aws-ebs-csi-driver \
              --service-account-role-arn "$ROLE_ARN" \
              --resolve-conflicts OVERWRITE \
              --region "$REGION"
          else
            echo "Add-on exists with status: $STATUS. Updating..."

            aws eks update-addon \
              --cluster-name "$CLUSTER" \
              --addon-name aws-ebs-csi-driver \
              --service-account-role-arn "$ROLE_ARN" \
              --resolve-conflicts OVERWRITE \
              --region "$REGION"
          fi

          echo "EBS CSI add-on operation completed."
  # ============================================================
  # STAGE 3: NGINX INGRESS CONTROLLER
  # ============================================================

  ingress-controller:
    name: 3. Install NGINX Ingress
    runs-on: ubuntu-latest
    needs: ebs-addon

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_GITHUB_CD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

      - name: Add ingress-nginx Helm repository
        run: |
          helm repo add ingress-nginx \
            https://kubernetes.github.io/ingress-nginx

          helm repo update

      - name: Install NGINX Ingress Controller
        run: |
          helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
            --namespace ingress-nginx \
            --create-namespace \
            --set controller.service.type=LoadBalancer \
            --wait \
            --timeout 10m

      - name: Validate Ingress Controller
        run: |
          kubectl get pods -n ingress-nginx
          kubectl get svc -n ingress-nginx

  # ============================================================
  # STAGE 4: CERT-MANAGER
  # ============================================================

  cert-manager:
    name: 4. Install cert-manager
    runs-on: ubuntu-latest
    needs: ingress-controller

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_GITHUB_CD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

      - name: Add Jetstack Helm repository
        run: |
          helm repo add jetstack https://charts.jetstack.io
          helm repo update

      - name: Install cert-manager
        run: |
          helm upgrade --install cert-manager jetstack/cert-manager \
            --namespace cert-manager \
            --create-namespace \
            --set crds.enabled=true \
            --wait \
            --timeout 10m

      - name: Validate cert-manager
        run: |
          kubectl get pods -n cert-manager
          kubectl get crd | grep cert-manager

  # ============================================================
  # STAGE 5: HELM VALIDATION
  # ============================================================

  helm-validation:
    name: 5. Helm Installation / Validation
    runs-on: ubuntu-latest
    needs: cert-manager

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Validate Helm installation
        run: |
          helm version
          helm env

      - name: Validate UI Helm chart
        run: |
          helm lint "$UI_CHART_PATH"

          helm template "$UI_RELEASE_NAME" "$UI_CHART_PATH" \
            --namespace "$APP_NAMESPACE" \
            --set image.repository="$UI_IMAGE_REPOSITORY" \
            --set image.tag="$IMAGE_TAG"

  # ============================================================
  # STAGE 6: ARGOCD INSTALLATION
  # ============================================================

  argocd-install:
    name: 6. Install ArgoCD
    runs-on: ubuntu-latest
    needs: helm-validation

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_GITHUB_CD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

      - name: Add ArgoCD Helm repository
        run: |
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo update

      - name: Install ArgoCD
        run: |
          helm upgrade --install argocd argo/argo-cd \
            --namespace argocd \
            --create-namespace \
            --set server.service.type=ClusterIP \
            --wait \
            --timeout 15m

      - name: Validate ArgoCD
        run: |
          kubectl get pods -n argocd
          kubectl get svc -n argocd

  # ============================================================
  # STAGE 7: EXPOSE ARGOCD PORT
  # ============================================================

  argocd-expose:
    name: 7. Expose ArgoCD Port
    runs-on: ubuntu-latest
    needs: argocd-install

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_GITHUB_CD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

      - name: Expose ArgoCD using LoadBalancer
        run: |
          kubectl patch svc argocd-server \
            -n argocd \
            -p '{"spec":{"type":"LoadBalancer"}}'

      - name: Wait for ArgoCD external address
        run: |
          for i in {1..30}; do
            ADDRESS=$(kubectl get svc argocd-server \
              -n argocd \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')

            if [ -n "$ADDRESS" ]; then
              echo "ArgoCD URL: https://$ADDRESS"
              break
            fi

            echo "Waiting for LoadBalancer..."
            sleep 20
          done

      - name: Display ArgoCD service
        run: |
          kubectl get svc argocd-server -n argocd

  # ============================================================
  # STAGE 8: DEPLOY UI IMAGE USING HELM
  # ============================================================

  deploy-ui:
    name: 8. Deploy UI Image Using Helm
    runs-on: ubuntu-latest
    needs: argocd-expose

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_GITHUB_CD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

      - name: Create application namespace
        run: |
          kubectl create namespace "$APP_NAMESPACE" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Deploy UI using Helm
        run: |
          helm upgrade --install "$UI_RELEASE_NAME" "$UI_CHART_PATH" \
            --namespace "$APP_NAMESPACE" \
            --create-namespace \
            --set image.repository="$UI_IMAGE_REPOSITORY" \
            --set image.tag="$IMAGE_TAG" \
            --wait \
            --timeout 10m

      - name: Validate UI deployment
        run: |
          kubectl get pods -n "$APP_NAMESPACE"
          kubectl get svc -n "$APP_NAMESPACE"
          kubectl get ingress -n "$APP_NAMESPACE" || true

          kubectl rollout status deployment/"$UI_RELEASE_NAME" \
            -n "$APP_NAMESPACE" \
            --timeout=5m

  # ============================================================
  # STAGE 9: FINAL VALIDATION
  # ============================================================

  final-validation:
    name: 9. Final Deployment Validation
    runs-on: ubuntu-latest
    needs: deploy-ui

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_GITHUB_CD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

      - name: Final validation
        run: |
          echo "===== Nodes ====="
          kubectl get nodes

          echo "===== Ingress ====="
          kubectl get pods -n ingress-nginx

          echo "===== cert-manager ====="
          kubectl get pods -n cert-manager

          echo "===== ArgoCD ====="
          kubectl get pods -n argocd

          echo "===== UI Application ====="
          kubectl get all -n "$APP_NAMESPACE"

          echo "===== Helm Releases ====="
          helm list -A

          echo "Deployment completed successfully."